<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Asistencia - Profesores</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        h1 { color: #333; margin-bottom: 20px; }
        
        #status { margin: 0 auto 15px auto; padding: 12px; font-weight: bold; font-size: 1.2em; color: #0056b3; background-color: white; border-radius: 8px; max-width: 450px; box-shadow: 0px 4px 10px rgba(0,0,0,0.08); }
        #reader { width: 100%; max-width: 450px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        
        .botones-principales { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .btn-toggle { background-color: #333; color: white; border: none; padding: 12px 22px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-toggle:hover { background-color: #555; }
        .btn-descarga { background-color: #28a745; }
        .btn-descarga:hover { background-color: #218838; }

        #panel-descarga { display: none; background: white; max-width: 500px; margin: 15px auto 0 auto; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); border-top: 4px solid #28a745; }
        .selector-tipo-descarga { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-tipo-rep { flex: 1; padding: 10px; font-size: 14px; font-weight: bold; border: 2px solid #ddd; border-radius: 6px; background: #f9f9f9; color: #555; cursor: pointer; transition: 0.2s; }
        .btn-tipo-rep.activo { border-color: #0056b3; background: #ebf5fb; color: #0056b3; }

        .caja-filtro-fecha { display: flex; flex-direction: column; align-items: center; gap: 12px; background: #f4f6f9; padding: 15px; border-radius: 6px; }
        .caja-filtro-fecha input { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; width: 80%; max-width: 240px; text-align: center; font-weight: bold; }

        .btn-confirmar-descarga { background-color: #28a745; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; max-width: 280px; transition: 0.3s; }
        .btn-confirmar-descarga:hover { background-color: #1e7e34; }

        #contenedor-tabla { display: none; margin-top: 20px; overflow-x: auto; }
        table { width: 100%; max-width: 650px; margin: 0 auto; border-collapse: collapse; background: white; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #0056b3; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        td.nombre-profe { text-align: left; font-weight: bold; }
        .hora-entrada { color: #1e8449; font-weight: bold; }
        .hora-salida { color: #0056b3; font-weight: bold; }

        #reader select { padding: 12px !important; font-size: 16px !important; margin-bottom: 20px !important; border-radius: 5px !important; width: 90% !important; max-width: 300px !important; border: 2px solid #ccc !important; }
        #reader button { padding: 15px 25px !important; font-size: 16px !important; margin: 10px !important; border-radius: 8px !important; background-color: #0056b3 !important; color: white !important; border: none !important; font-weight: bold !important; cursor: pointer !important; box-shadow: 0 4px 6px rgba(0,0,0,0.1) !important; transition: 0.3s !important; }
        #reader button:hover { background-color: #004494 !important; }
        #reader a { font-size: 16px !important; display: inline-block !important; margin-top: 15px !important; padding: 10px !important; color: #0056b3 !important; }
    </style>
</head>
<body>

    <h1>Control de Asistencia para Empleados</h1>
    <div id="status">Iniciando sistema...</div>
    <div id="reader"></div>

    <div class="botones-principales">
        <button id="btn-tabla" class="btn-toggle" onclick="toggleTabla()">📋 Ver registros de hoy</button>
        <button id="btn-abrir-descarga" class="btn-toggle btn-descarga" onclick="togglePanelDescarga()">📊 Descargar Reportes</button>
    </div>

    <div id="panel-descarga">
        <h3 style="margin-top: 0; margin-bottom: 12px; color: #333;">Selecciona el tipo de reporte a descargar:</h3>
        <div class="selector-tipo-descarga">
            <button id="btn-modo-dia" class="btn-tipo-rep activo" onclick="cambiarModoDescarga('dia')">📅 Por Día Específico</button>
            <button id="btn-modo-mes" class="btn-tipo-rep" onclick="cambiarModoDescarga('mes')">🗓️ Lista Completa del Mes</button>
        </div>
        <div id="filtro-descarga-dia" class="caja-filtro-fecha">
            <label><strong>Elige la fecha a consultar:</strong></label>
            <input type="date" id="input-fecha-especifica">
            <button class="btn-confirmar-descarga" onclick="descargarExcelDia()">⬇️ Descargar Excel del Día</button>
        </div>
        <div id="filtro-descarga-mes" class="caja-filtro-fecha" style="display: none;">
            <label><strong>Elige el mes completo:</strong></label>
            <input type="month" id="input-mes-completo">
            <button class="btn-confirmar-descarga" onclick="descargarExcelMes()">⬇️ Descargar Excel del Mes</button>
        </div>
    </div>

    <div id="contenedor-tabla">
        <h2>Registros de Hoy</h2>
        <table>
            <thead>
                <tr><th>No.</th><th>Empleado</th><th>Entrada</th><th>Salida</th></tr>
            </thead>
            <tbody id="tabla-asistencias">
                <tr><td colspan="4">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- LLAVES DE SUPABASE ---
        const URL_PROYECTO = 'https://kqdfoqityolwrxvpgblu.supabase.co';
        const LLAVE_PUBLICA = 'sb_publishable_rcACwicJA2Guh2Pth55S7g_qs8VcoI9';
        const clienteSupabase = supabase.createClient(URL_PROYECTO, LLAVE_PUBLICA);

        // --- TOKEN DE TELEGRAM ---
        const PARTE_1_TOKEN = '8887434969'; 
        const PARTE_2_TOKEN = 'AAH7a_QS4GqqjdFu0xnW1VCBVpP6IDPstn4'; 
        const TOKEN_TELEGRAM = PARTE_1_TOKEN + ':' + PARTE_2_TOKEN;
        let ultimoUpdateTelegram = 0; 

        // --- SISTEMA DE SONIDO ---
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContextClass();
        document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); });

        function reproducirSonido(tipo) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const ahora = audioCtx.currentTime;
                if (tipo === 'exito') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, ahora); osc.frequency.setValueAtTime(1318.51, ahora + 0.08);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.22);
                    osc.start(ahora); osc.stop(ahora + 0.22);
                } else if (tipo === 'alerta') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, ahora); osc.frequency.setValueAtTime(330, ahora + 0.12);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.28);
                    osc.start(ahora); osc.stop(ahora + 0.28);
                } else if (tipo === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, ahora);
                    gain.gain.setValueAtTime(0.3, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.35);
                    osc.start(ahora); osc.stop(ahora + 0.35);
                }
            } catch (e) {}
        }

        const statusText = document.getElementById('status');
        let ultimoEscaneo = ""; let procesandoEscaneo = false;
        const ahoraInit = new Date();
        document.getElementById('input-fecha-especifica').value = ahoraInit.toLocaleDateString('sv-SE');
        document.getElementById('input-mes-completo').value = `\${ahoraInit.getFullYear()}-${String(ahoraInit.getMonth() + 1).padStart(2, '0')}`;  const escaner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: function(vw, vh) { let a = Math.min(vw, vh); return { width: Math.floor(a * 0.85), height: Math.floor(a * 0.85) }; } }, false);  function toggleTabla() { const cont = document.getElementById('contenedor-tabla'); const btn = document.getElementById('btn-tabla'); if (cont.style.display === 'none' \vert{}\vert{} cont.style.display === '') { cont.style.display = 'block'; btn.innerText = '📋 Ocultar registros de hoy'; } else { cont.style.display = 'none'; btn.innerText = '📋 Ver registros de hoy'; } }  function togglePanelDescarga() { const panel = document.getElementById('panel-descarga'); const btn = document.getElementById('btn-abrir-descarga'); if (panel.style.display === 'none' \vert{}\vert{} panel.style.display === '') { panel.style.display = 'block'; btn.innerText = '✖️ Cerrar Opciones de Descarga'; } else { panel.style.display = 'none'; btn.innerText = '📊 Descargar Reportes'; } }  function cambiarModoDescarga(modo) { document.getElementById('btn-modo-dia').classList.toggle('activo', modo === 'dia'); document.getElementById('btn-modo-mes').classList.toggle('activo', modo === 'mes'); document.getElementById('filtro-descarga-dia').style.display = modo === 'dia' ? 'flex' : 'none'; document.getElementById('filtro-descarga-mes').style.display = modo === 'mes' ? 'flex' : 'none'; }  async function cargarAsistencias() { const fechaHoy = new Date().toLocaleDateString('sv-SE'); const { data, error } = await clienteSupabase.from('asistencias_diarias').select('hora_entrada, hora_salida, profesores(nombre_completo)').eq('fecha', fechaHoy).order('hora_entrada', { ascending: false }); const tablaCuerpo = document.getElementById('tabla-asistencias'); tablaCuerpo.innerHTML = ""; if (error \vert{}\vert{} !data \vert{}\vert{} data.length === 0) { tablaCuerpo.innerHTML = "<tr><td colspan='4'>Aún no hay registros hoy.</td></tr>"; return; } data.forEach((registro, index) => { const nombre = registro.profesores?.nombre_completo \vert{}\vert{} "Empleado"; tablaCuerpo.innerHTML += `<tr><td>${index + 1}</td><td class="nombre-profe">\${nombre}</td><td class="hora-entrada">\${registro.hora_entrada || "---"}</td><td class="hora-salida">\${registro.hora_salida || "---"}</td></tr>`;
            });
        }

        // ==========================================
        // 🤖 ROBOT AUTO-VINCULADOR EN LA NUBE ☁️
        // ==========================================
        async function procesarNuevosMensajesTelegram() {
            if (PARTE_1_TOKEN === 'PEGAR_AQUI_LOS_NUMEROS') return;
            const url = `https://api.telegram.org/bot${TOKEN_TELEGRAM}/getUpdates?offset=${ultimoUpdateTelegram + 1}`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.ok && data.result.length > 0) {
                    for (const update of data.result) {
                        ultimoUpdateTelegram = update.update_id; 
                        
                        if (update.message && update.message.text) {
                            const textoRecibido = update.message.text.trim().toUpperCase();
                            const chatId = update.message.chat.id;
                            
                            if (textoRecibido === 'VINCULAR DIRECTIVO') {
                                await clienteSupabase.from('configuracion').update({ chat_id_directivo: chatId.toString() }).eq('id', 1);
                                
                                await fetch(`https://api.telegram.org/bot${TOKEN_TELEGRAM}/sendMessage`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chatId, text: "✅ ¡Cuenta de Directivo enlazada en la nube!\n\nSu configuración ha sido guardada en la base de datos principal. No importa si cambian de computadora o abren el sistema desde un celular, los avisos llegarán aquí." }) }); } } } } } catch (error) { console.error("Error en Auto-Vinculador Nube", error); } }  // --- FUNCIÓN PARA ENVIAR ALERTAS AL DIRECTIVO --- async function enviarAlertaDirectivo(chatIdDirectivo, mensaje) { if (!chatIdDirectivo \vert{}\vert{} PARTE_1_TOKEN === 'PEGAR_AQUI_LOS_NUMEROS') return; const url = `https://api.telegram.org/bot${TOKEN_TELEGRAM}/sendMessage`;
            try { 
                await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chatIdDirectivo, text: mensaje }) }); 
            } catch (e) { console.error("Error al enviar alerta:", e); }
        }

        // --- ESCANEO EXITOSO ---
        async function onScanSuccess(codigoEscaneado) {
            if (procesandoEscaneo || codigoEscaneado === ultimoEscaneo) return;
            procesandoEscaneo = true; ultimoEscaneo = codigoEscaneado;
            statusText.innerText = "Buscando en la base de datos..."; statusText.style.color = "orange";

            try {
                const { data: profe, error: errorProfe } = await clienteSupabase.from('profesores').select('id, nombre_completo').eq('codigo_qr', codigoEscaneado).single();
                if (errorProfe || !profe) {
                    reproducirSonido('error'); statusText.innerText = "❌ Error: Este código no pertenece a ningún empleado."; statusText.style.color = "red"; reiniciarEscaner(); return;
                }

                const fechaHoy = new Date().toLocaleDateString('sv-SE'); 
                const horaActual = new Date().toLocaleTimeString('en-GB'); 

                const { data: registrosHoy } = await clienteSupabase.from('asistencias_diarias').select('*').eq('profesor_id', profe.id).eq('fecha', fechaHoy).limit(1); 
                const asistencia = (registrosHoy && registrosHoy.length > 0) ? registrosHoy[0] : null;

                const { data: config } = await clienteSupabase.from('configuracion').select('chat_id_directivo').eq('id', 1).single();
                const chatIdCloud = config ? config.chat_id_directivo : null;

                if (!asistencia) {
                    await clienteSupabase.from('asistencias_diarias').insert([{ profesor_id: profe.id, fecha: fechaHoy, hora_entrada: horaActual }]);
                    reproducirSonido('exito'); statusText.innerText = `✅ ENTRADA REGISTRADA: \${profe.nombre_completo}`; statusText.style.color = "green";
                    enviarAlertaDirectivo(chatIdCloud, `🏫 CONTROL DE ASISTENCIA\n\n🟢 ENTRADA REGISTRADA\nEmplead@: ${profe.nombre_completo}\nHora:${horaActual}`);
                } else if (!asistencia.hora_salida) {
                    await clienteSupabase.from('asistencias_diarias').update({ hora_salida: horaActual }).eq('id', asistencia.id);
                    reproducirSonido('exito'); statusText.innerText = `👋 SALIDA REGISTRADA: \${profe.nombre_completo}`; statusText.style.color = "blue";
                    enviarAlertaDirectivo(chatIdCloud, `🏫 CONTROL DE ASISTENCIA\n\n🔵 SALIDA REGISTRADA\nEmplead@: ${profe.nombre_completo}\nHora:${horaActual}`);
                } else {
                    reproducirSonido('alerta'); statusText.innerText = `⚠️
